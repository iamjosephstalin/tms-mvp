<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMS - Telecalling Management System</title>

  <!-- Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design System Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            border: '#E4E4E7', // zinc-200
            input: '#E4E4E7', // zinc-200
            ring: '#4F46E5', // indigo-600
            background: '#ffffff',
            foreground: '#09090b', // zinc-950
            primary: {
              DEFAULT: '#4F46E5', // Indigo 600
              foreground: '#ffffff',
            },
            muted: {
              DEFAULT: '#FAFAFA', // zinc-50
              foreground: '#71717A', // zinc-500
            },
          },
          borderRadius: {
            lg: '0.5rem',
            md: 'calc(0.5rem - 2px)',
            sm: 'calc(0.5rem - 4px)',
          }
        }
      }
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.1",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
        "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
      }
    }
    </script>
  <style type="text/tailwindcss">
    @layer base {
        body {
          @apply bg-background text-foreground antialiased;
          font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        *, ::after, ::before {
          @apply border-border;
        }
      }
      @layer utilities {
        .scrollbar-thin::-webkit-scrollbar {
          width: 5px;
          height: 5px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
          background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
          @apply bg-zinc-200 rounded-full hover:bg-zinc-300;
        }
        .glass {
          @apply bg-white/80 backdrop-blur-md border-b border-border;
        }
      }
      /* Global Table Reset */
      table {
        @apply w-full caption-bottom text-sm;
      }
      thead tr {
        @apply border-b transition-colors hover:bg-muted/50 data-[state=selected]:bg-muted;
      }
      th {
        @apply h-10 px-4 text-left align-middle font-medium text-muted-foreground uppercase tracking-wider text-[11px];
      }
      td {
        @apply p-4 align-middle [&:has([role=checkbox])]:pr-0 border-b border-zinc-50;
      }
      tr {
        @apply hover:bg-muted/50;
      }
    </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
